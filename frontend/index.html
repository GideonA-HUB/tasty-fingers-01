<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ED7D2B" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('tasty-fingers-theme');
          var dark = false;
          if (raw === 'dark') {
            dark = true;
          } else if (raw) {
            var parsed = JSON.parse(raw);
            dark = parsed && parsed.state && parsed.state.theme === 'dark';
          }
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0a0a0a');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Tasty Fingers - Premium Restaurant & Food Ordering</title>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#fff;">
      <svg width="52" height="52" viewBox="0 0 64 64" style="animation:boot-spin 1.05s linear infinite;">
        <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="4" />
        <circle cx="32" cy="32" r="26" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-dasharray="70 120" style="animation:boot-dash 1.05s ease-in-out infinite;" />
        <circle cx="32" cy="32" r="26" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="50 140" stroke-dashoffset="80" style="animation:boot-dash-r 1.05s ease-in-out infinite;filter:drop-shadow(0 0 1px rgba(0,0,0,0.35));" />
      </svg>
    </div>
    <style>
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-dash { 0% { stroke-dashoffset: 0; } 50% { stroke-dashoffset: -40; } 100% { stroke-dashoffset: -90; } }
      @keyframes boot-dash-r { 0% { stroke-dashoffset: 80; } 50% { stroke-dashoffset: 120; } 100% { stroke-dashoffset: 170; } }
      html.dark #boot-loader { background: #0a0a0a; }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
